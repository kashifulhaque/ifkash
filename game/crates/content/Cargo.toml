[package]
name = "lf-content"
description = "Latticefall content data types, loader, and validation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TypeScript type generation. Only lf-tools enables this, so the WASM and Python
# builds don't carry ts-rs.
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
postcard.workspace = true
xxhash-rust.workspace = true
# Deterministic tan for scatter slope limits (level.rs).
libm.workspace = true
ron = "0.12"
serde_json = "1"
ts-rs = { version = "12", optional = true }
