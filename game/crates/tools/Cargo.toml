[package]
name = "lf-tools"
description = "Latticefall command-line tools."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "lf-tools"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# `bots`: the M7 boss bots, which the balance report drives (WP-089).
lf-core = { workspace = true, features = ["bots"] }
lf-content = { workspace = true, features = ["ts"] }
serde_json = "1"
ts-rs = "12"
