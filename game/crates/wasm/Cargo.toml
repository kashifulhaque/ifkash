[package]
name = "lf-wasm"
description = "Latticefall wasm-bindgen facade."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Developer commands (teleport, god mode, set-level) for the browser dev tools. Off by
# default, so release builds of the module don't contain them. See `src/debug.rs`.
dev = []

[dependencies]
lf-core.workspace = true
lf-content.workspace = true
# The CLI that generates the JS glue must be the same version; scripts/build-wasm.sh checks.
wasm-bindgen = "=0.2.106"
