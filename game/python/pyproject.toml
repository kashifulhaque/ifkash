[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "latticefall"
version = "0.1.0"
description = "Python bindings for the Latticefall simulation."
requires-python = ">=3.11"
# The base package needs nothing beyond the extension. The extras are for RL work
# (ADR 0006): `env` for the Gymnasium environments, `train` for the PPO examples.

[project.optional-dependencies]
env = ["gymnasium>=1.0,<2", "numpy>=1.26"]
train = ["latticefall[env]", "torch>=2.4"]

[tool.maturin]
manifest-path = "../crates/py/Cargo.toml"
python-source = "."
module-name = "latticefall._latticefall"
# No `features = ["pyo3/extension-module"]`: PyO3 0.30 deprecated that feature, and
# maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE during the build instead.

[tool.pytest.ini_options]
testpaths = ["tests"]
