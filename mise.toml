[tools]
bun = "latest"
node = "lts"
rust = "stable"
typst = "latest"
wrangler = "latest"

[tasks."api:prep"]
dir = "api"
description = "Install wasm target + worker-build for Cloudflare Rust Workers"
run = """
rustup target add wasm32-unknown-unknown
cargo install -q worker-build
"""

[tasks."api:build"]
dir = "api"
description = "Build the Worker (release) using worker-build"
run = "worker-build --release"

[tasks."api:dev"]
dir = "api"
description = "Run the Worker locally with wrangler + Miniflare (KV persisted)"
run = "npx wrangler dev --persist-to .wrangler/state"

[tasks."api:clean"]
dir = "api"
description = "Delete local Miniflare state (KV, caches, etc.)"
run = "rm -rf .wrangler/state"

[tasks."web:dev"]
description = "Run the SvelteKit app locally"
run = """
bun install
bun run dev
"""

[tasks."assets:fonts"]
description = "Download fonts (Crimson Pro, Cardo) directly from Google Fonts GitHub"
run = """
mkdir -p .fonts

# Crimson Pro (Variable Font: supports all weights)
# We download both Roman and Italic styles
curl -L -o .fonts/CrimsonPro.ttf "https://github.com/google/fonts/raw/main/ofl/crimsonpro/CrimsonPro%5Bwght%5D.ttf"
curl -L -o .fonts/CrimsonPro-Italic.ttf "https://github.com/google/fonts/raw/main/ofl/crimsonpro/CrimsonPro-Italic%5Bwght%5D.ttf"

# Cardo (Static Fonts)
base_url="https://github.com/google/fonts/raw/main/ofl/cardo"
curl -L -o .fonts/Cardo-Regular.ttf "$base_url/Cardo-Regular.ttf"
curl -L -o .fonts/Cardo-Bold.ttf "$base_url/Cardo-Bold.ttf"
curl -L -o .fonts/Cardo-Italic.ttf "$base_url/Cardo-Italic.ttf"
"""
outputs = [".fonts/CrimsonPro.ttf", ".fonts/Cardo-Regular.ttf"]

[tasks."assets:typst"]
description = "Compile all .typ files in static/typst to PDF using local fonts"
depends = ["assets:fonts"]
run = """
# Iterate over all .typ files in the directory
for file in ./static/assets/*.typ; do
  echo "Compiling $file..."
  # --font-path tells Typst where to look for the fonts we just downloaded
  typst compile "$file" --font-path .fonts
done
"""

# Game workspace (game/). The root [tools] block sets RUSTUP_TOOLCHAIN=stable, which
# overrides game/rust-toolchain.toml. Every game:* task therefore sets RUSTUP_TOOLCHAIN
# to the pinned version explicitly. Keep it in sync with game/rust-toolchain.toml.

[tasks."game:test"]
dir = "game"
env = { RUSTUP_TOOLCHAIN = "1.99.1" }
description = "Run the game workspace tests"
run = "cargo test --workspace"

[tasks."game:lint"]
dir = "game"
env = { RUSTUP_TOOLCHAIN = "1.99.1" }
description = "Run clippy and rustfmt checks on the game workspace"
run = """
cargo clippy --workspace --all-targets -- -D warnings
cargo fmt --all --check
"""

[tasks."game:validate"]
dir = "game"
env = { RUSTUP_TOOLCHAIN = "1.99.1" }
description = "Validate game content data"
run = """
bun ../scripts/export-content.ts
cargo run -q -p lf-tools -- validate
"""

[tasks."game:bench"]
dir = "game"
env = { RUSTUP_TOOLCHAIN = "1.99.1" }
description = "Run game simulation benchmarks"
run = "cargo run -q --release -p lf-tools -- bench"

[tasks."game:wasm"]
description = "Build lf-wasm into src/lib/latticefall/wasm/ (stub until WP-006)"
run = "echo 'game:wasm: not yet implemented'"

[tasks."game:py"]
dir = "game/python"
env = { RUSTUP_TOOLCHAIN = "1.99.1" }
description = "Build, test, and benchmark the Python bindings"
run = """
[ -x .venv/bin/python ] || uv venv --python 3.11 .venv
[ -x .venv/bin/maturin ] && [ -x .venv/bin/pytest ] || uv pip install --python .venv/bin/python maturin pytest
VIRTUAL_ENV="$PWD/.venv" PATH="$PWD/.venv/bin:$PATH" maturin develop --release
.venv/bin/python -m pytest -q
.venv/bin/python examples/bench.py
"""
