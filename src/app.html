<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1e7" />
    <script>
      (function () {
        // Keep the ids and colors in sync with `meta.ts` in each folder of
        // src/lib/designs. A saved id that isn't listed here falls back to almanac.
        var colors = {
          almanac: { light: "#f6f1e7", dark: "#1a1714" },
          japandi: { light: "#f3efe7", dark: "#1b1b1a" },
          ember: { light: "#e8dcc0", dark: "#0b0a09" }
        };
        var theme = "light";
        var design = "almanac";
        try {
          var savedTheme = localStorage.getItem("ifkash-theme");
          // "light" and "dark" are explicit. Anything else follows the system theme.
          if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
          else if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
          var savedDesign = localStorage.getItem("ifkash-design");
          if (savedDesign && Object.prototype.hasOwnProperty.call(colors, savedDesign)) design = savedDesign;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-design", design);
        // The server renders the almanac shell. For any other design, hide the
        // page until the root layout mounts that design's shell. The timeout
        // keeps the page visible if the script never runs.
        if (design !== "almanac") {
          root.setAttribute("data-shell-pending", "");
          setTimeout(function () { root.removeAttribute("data-shell-pending"); }, 1500);
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", colors[design][theme]);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
