<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1ea" />
    <script>
      (function () {
        // Keep the color table in sync with THEME_COLORS in src/lib/stores/appearance.ts.
        var colors = {
          nordisk: { light: "#f4f1ea", dark: "#15181b" },
          broadsheet: { light: "#f3ecdf", dark: "#14110e" },
          atelier: { light: "#eef2ea", dark: "#121614" }
        };
        var theme = "light";
        var design = "nordisk";
        try {
          var savedTheme = localStorage.getItem("ifkash-theme");
          if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
          else if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
          var savedDesign = localStorage.getItem("ifkash-design");
          if (savedDesign === "nordisk" || savedDesign === "broadsheet" || savedDesign === "atelier") design = savedDesign;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-design", design);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", colors[design][theme]);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
